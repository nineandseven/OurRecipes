<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>OurRecipes</title>

    <!-- Material Symbols -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..200&display=swap"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-25..200&family=Noto+Sans+TC:wght@400;500;600;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/reset.css" />
    <link rel="stylesheet" href="./css/theme.css" />
    <link rel="stylesheet" href="./css/global.css" />
    <link rel="stylesheet" href="./css/style.css" />

    <meta name="theme-color" content="#000" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="icon" type="image/png" href="./images/icons/icon-192.png">
    <link rel="apple-touch-icon" href="./images/icons/icon-192.png" />

    <link rel="manifest" href="./manifest.json">
  </head>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./js/sw.js");
      });
    }
  </script>

  <body>
    <!-- =========================================================
         HEADER
    ========================================================== -->

    <header class="header">
      <div class="header-inner">
        <!-- LOGO -->

        <a href="#" class="logo">
          <div class="logo-icon">
            <span class="material-symbols-rounded"> restaurant </span>
          </div>

          <span> OurRecipes </span>
        </a>

        <!-- SEARCH -->

        <div class="header-search">
          <span class="material-symbols-rounded"> search </span>

          <input
            id="searchInput"
            class="search-input"
            type="search"
            placeholder="搜尋食譜、食材..."
            autocomplete="off"
          />
        </div>

        <!-- ACTIONS -->

        <div class="header-actions">
          <button
            class="icon-button theme-button"
            type="button"
            aria-label="切換主題"
          >
            <span class="material-symbols-rounded"> dark_mode </span>
          </button>

          <!-- <button class="icon-button" type="button" aria-label="新增食譜">
            <span class="material-symbols-rounded"> add </span>
          </button> -->
        </div>
      </div>
    </header>

    <!-- =========================================================
         PAGE
    ========================================================== -->

    <div class="page">
      <!-- =====================================================
             SIDEBAR
        ====================================================== -->

      <aside class="sidebar">
        <div class="sidebar-title">MENU</div>

        <nav class="nav-list">
          <button class="nav-item active" type="button">
            <span class="material-symbols-rounded"> grid_view </span>

            <span class="nav-label"> 所有食譜 </span>

            <span class="nav-count" data-count="all"> 0 </span>
          </button>

          <button class="nav-item" type="button">
            <span class="material-symbols-rounded"> favorite </span>

            <span class="nav-label"> 收藏食譜 </span>

            <span class="nav-count" data-count="favorites"> 0 </span>
          </button>

          <button class="nav-item" type="button">
            <span class="material-symbols-rounded"> schedule </span>

            <span class="nav-label"> 最近新增 </span>

            <span class="nav-count" data-count="recent"> 0 </span>
          </button>
        </nav>

        <div class="sidebar-title">INGREDIENTS</div>

        <div class="tag-list" id="tagList"></div>
      </aside>

      <!-- =====================================================
             MAIN
        ====================================================== -->

      <main class="main">
        <!-- TOOLBAR -->

        <section class="toolbar">
          <div class="category-toolbar" id="categoryToolbar"></div>

          <div class="recipe-count">共 0 道食譜</div>
        </section>

        <!-- RECIPE GRID -->

        <section id="recipeGrid" class="recipe-grid"></section>

        <!-- EMPTY -->

        <div class="empty-state">
          <span class="material-symbols-rounded"> search_off </span>

          <h3>找不到食譜</h3>

          <p>試試其他關鍵字、分類或食材。</p>
        </div>
      </main>
    </div>

    <!-- =========================================================
         RECIPE MODAL
    ========================================================== -->

    <div id="recipeModal" class="modal">
      <div class="modal-content">
        <button class="modal-close" type="button" aria-label="關閉">
          <span class="material-symbols-rounded"> close </span>
        </button>

        <div class="modal-image">
          <img src="" alt="" />
        </div>

        <div class="modal-body">
          <div class="modal-category">分類</div>

          <h2 class="modal-title">食譜名稱</h2>

          <p class="modal-description">食譜描述</p>

          <div class="modal-meta"></div>

          <!-- INGREDIENTS -->

          <section class="modal-section">
            <h3>食材</h3>

            <div class="ingredient-list"></div>
          </section>

          <!-- STEPS -->

          <section class="modal-section">
            <h3>作法</h3>

            <div class="step-list"></div>
          </section>
        </div>
      </div>
    </div>

    <!-- =========================================================
         THEME + BASIC JS
    ========================================================== -->

    <script src="./js/data.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
